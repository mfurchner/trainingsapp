<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trainings-App v0.3</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head><body>
<header><h1>🏋️ Trainings-App <small>v0.3</small></h1></header>
<main>
<div class="card">
<h2>Heute</h2>
<p>Woche 1 – Training A</p>
<div id="display">00:45</div>
<div class="buttons">
<button id="start">▶ Start</button>
<button id="pause">⏸ Pause</button>
<button id="reset">↺ Reset</button>
</div>
</div>

<div class="card">
<h2>Übungen</h2>
<details><summary>Kniebeugen</summary><p>3×12 Wiederholungen.</p></details>
<details><summary>Ausfallschritte</summary><p>3×10 je Seite.</p></details>
<details><summary>Plank</summary><p>3×30 Sekunden.</p></details>
<p><label><input id="done" type="checkbox"> Training abgeschlossen</label></p>
</div>
</main>
<script src="js/app.js"></script>
</body></html>
